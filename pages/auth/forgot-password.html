<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | AuraGrowth</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/landing.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="hero-glow"></div>

    <div class="container" style="max-width: 440px;">
        <div class="text-center mb-4">
            <a href="../../index.html" class="text-decoration-none">
                <span class="fs-3 gradient-text"><i class="fa-solid fa-brain me-2"></i>AuraGrowth</span>
            </a>
            <p class="text-secondary small mt-1">Recover account access</p>
        </div>

        <div class="glass-card p-4 p-md-5">
            <h3 class="fw-bold mb-3 text-center">Reset Password</h3>
            <p class="text-secondary small text-center mb-4">Enter your registered email address to receive a secure password recovery link.</p>
            
            <div id="authAlert" class="alert d-none mb-3" role="alert"></div>

            <form id="forgotForm">
                <div class="mb-4">
                    <label class="form-label text-secondary small">Email Address</label>
                    <input type="email" id="email" class="form-control bg-transparent text-white border-secondary" required placeholder="name@student.edu">
                </div>

                <button type="submit" class="btn btn-gradient w-100 py-2">Send Reset Link</button>
            </form>

            <div class="text-center mt-4 pt-2 border-top border-secondary-subtle">
                <p class="text-secondary small mb-0"><a href="login.html" class="text-primary text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Back to login</a></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/config/supabase-config.js"></script>
    <script src="../../assets/js/app/auth.app.js"></script>
</body>
</html>
