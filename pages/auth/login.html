<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | AuraGrowth</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/landing.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="hero-glow"></div>

    <div class="container" style="max-width: 440px;">
        <div class="text-center mb-4">
            <a href="../../index.html" class="text-decoration-none">
                <span class="fs-3 gradient-text"><i class="fa-solid fa-brain me-2"></i>AuraGrowth</span>
            </a>
            <p class="text-secondary small mt-1">Welcome back! Check your progress today.</p>
        </div>

        <div class="glass-card p-4 p-md-5">
            <h3 class="fw-bold mb-4 text-center">Sign In</h3>
            
            <div id="authAlert" class="alert d-none mb-3 py-2 small" role="alert"></div>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label text-secondary small">Email Address</label>
                    <input type="email" id="email" class="form-control bg-transparent text-white border-secondary" required placeholder="name@student.edu">
                </div>

                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <label class="form-label text-secondary small mb-0">Password</label>
                        <a href="forgot-password.html" class="text-secondary small text-decoration-none">Forgot password?</a>
                    </div>
                    <input type="password" id="password" class="form-control bg-transparent text-white border-secondary mt-1" required placeholder="Enter password">
                </div>

                <button type="submit" id="submitBtn" class="btn btn-gradient w-100 py-2 mt-2">Log In</button>
            </form>

            <div class="text-center mt-4 pt-2 border-top border-secondary-subtle">
                <p class="text-secondary small mb-0">Don't have an account? <a href="register.html" class="text-primary text-decoration-none fw-semibold">Sign Up</a></p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/config/supabase-config.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var form = document.getElementById('loginForm');
            var alertBox = document.getElementById('authAlert');
            var submitBtn = document.getElementById('submitBtn');

            function showAlert(msg, isError) {
                alertBox.className = 'alert py-2 small ' + (isError ? 'alert-danger' : 'alert-success');
                alertBox.textContent = msg;
                alertBox.classList.remove('d-none');
            }

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                alertBox.classList.add('d-none');

                var email = document.getElementById('email').value.trim();
                var password = document.getElementById('password').value;

                // Client check
                var client = window.sb || window.supabaseClient;
                if (!client && window.supabase && window.SUPABASE_URL && window.SUPABASE_ANON_KEY) {
                    client = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
                }

                if (!client) {
                    showAlert("Supabase client connection dorakaledu! supabase-config.js check cheyandi.", true);
                    return;
                }

                // Loading animation
                var originalText = submitBtn.innerHTML;
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Logging in...';

                try {
                    var response = await client.auth.signInWithPassword({
                        email: email,
                        password: password
                    });

                    if (response.error) {
                        throw response.error;
                    }

                    showAlert("Login success! Redirecting...", false);

                    setTimeout(function() {
                        // Dashboard page ki redirect
                        window.location.href = "../student/dashboard.html";
                    }, 800);

                } catch (err) {
                    console.error("Login Error:", err);
                    showAlert(err.message || "Invalid email or password", true);
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalText;
                }
            });
        });
    </script>
</body>
</html>
