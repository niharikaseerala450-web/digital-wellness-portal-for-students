<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen-Time & Digital Wellness | AuraGrowth</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/landing.css">
</head>
<body>

    <div class="hero-glow"></div>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-custom border-bottom border-secondary-subtle sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-2" href="dashboard.html">
                <span class="fs-4 gradient-text"><i class="fa-solid fa-brain me-2"></i>AuraGrowth</span>
            </a>
            <div class="d-flex align-items-center gap-3 ms-auto">
                <a href="dashboard.html" class="btn btn-glass btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Dashboard</a>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container py-4" style="max-width: 950px;">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h2 class="fw-bold mb-1">Digital Distraction & Screen Wellness</h2>
                <p class="text-secondary mb-0">Track short-form video consumption versus deep-study blocks.</p>
            </div>
        </div>

        <div id="logAlert" class="alert d-none mb-3" role="alert"></div>

        <div class="row g-4">
            <!-- Form Column -->
            <div class="col-lg-5">
                <div class="glass-panel p-4">
                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-mobile-screen-button text-warning me-2"></i>Log Today's Screen-Time</h5>
                    <form id="screenLogForm">
                        <div class="mb-3">
                            <label class="form-label text-secondary small">Social Media / Reels (Minutes)</label>
                            <input type="number" id="socialMins" class="form-control bg-transparent text-white border-secondary" min="0" max="720" placeholder="e.g. 45" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary small">Deep Study / Focus Time (Minutes)</label>
                            <input type="number" id="studyMins" class="form-control bg-transparent text-white border-secondary" min="0" max="720" placeholder="e.g. 120" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary small">Primary App Distraction</label>
                            <select id="distractionApp" class="form-select bg-dark text-white border-secondary">
                                <option value="Instagram Reels">📸 Instagram Reels</option>
                                <option value="YouTube Shorts">▶️ YouTube Shorts</option>
                                <option value="Mobile Gaming">🎮 Mobile Gaming</option>
                                <option value="Messaging / Group Chats">💬 Group Chats</option>
                                <option value="None / Clean Day">🌟 None (Zero Distraction)</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label d-flex justify-content-between text-secondary small">
                                <span>Urge to Doomscroll (1 = Low, 10 = Severe)</span>
                                <span id="urgeVal" class="text-warning fw-bold">5</span>
                            </label>
                            <input type="range" class="form-range" min="1" max="10" value="5" id="rangeUrge">
                        </div>

                        <button type="submit" class="btn btn-gradient w-100 py-2">
                            <i class="fa-solid fa-cloud-arrow-up me-1"></i> Save Daily Metric
                        </button>
                    </form>
                </div>
            </div>

            <!-- Analytics & History Column -->
            <div class="col-lg-7">
                <div class="glass-panel p-4 mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h6 class="fw-bold mb-0">Study vs. Screen Ratio</h6>
                        <span class="badge bg-secondary-subtle text-info" id="ratioBadge">Analyzing...</span>
                    </div>
                    <div class="progress" style="height: 14px;">
                        <div id="ratioBar" class="progress-bar bg-success" style="width: 50%;"></div>
                    </div>
                    <small class="text-secondary d-block mt-2" id="ratioAdvice">Log your daily hours to calibrate study stamina.</small>
                </div>

                <div class="glass-panel p-4">
                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-clock-rotate-left text-info me-2"></i>Recent Logs</h5>
                    <div id="logsHistoryContainer">
                        <p class="text-secondary small text-center my-3">Loading records...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../assets/js/config/supabase-config.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            var alertBox = document.getElementById('logAlert');

            function showAlert(msg, type) {
                if (!alertBox) return;
                alertBox.className = 'alert alert-' + (type || 'success') + ' py-2 px-3 small';
                alertBox.textContent = msg;
                alertBox.classList.remove('d-none');
                setTimeout(function() { alertBox.classList.add('d-none'); }, 3500);
            }

            var { data: { session }, error } = await window.sb.auth.getSession();
            if (!session || error) {
                window.location.href = '../auth/login.html';
                return;
            }

            var user = session.user;

            // Slider update
            var rangeUrge = document.getElementById('rangeUrge');
            var urgeVal = document.getElementById('urgeVal');
            if (rangeUrge && urgeVal) {
                rangeUrge.oninput = function() { urgeVal.textContent = rangeUrge.value; };
            }

            var logsContainer = document.getElementById('logsHistoryContainer');
            var ratioBadge = document.getElementById('ratioBadge');
            var ratioBar = document.getElementById('ratioBar');
            var ratioAdvice = document.getElementById('ratioAdvice');

            async function loadLogs() {
                try {
                    var { data, error } = await window.sb
                        .from('screen_time_logs')
                        .select('*')
                        .eq('user_id', user.id)
                        .order('created_at', { ascending: false })
                        .limit(6);

                    if (error) throw error;
                    renderLogs(data || []);
                } catch (err) {
                    console.error('Failed to load screen time logs:', err);
                }
            }

            function renderLogs(logs) {
                if (!logsContainer) return;

                if (logs.length === 0) {
                    logsContainer.innerHTML = '<p class="text-secondary small text-center my-3">No screen-time logs recorded yet. Start tracking above!</p>';
                    return;
                }

                var latest = logs[0];
                var total = (latest.study_minutes || 0) + (latest.social_media_minutes || 0);
                if (total > 0) {
                    var studyPercent = Math.round((latest.study_minutes / total) * 100);
                    if (ratioBar) ratioBar.style.width = studyPercent + '%';
                    if (ratioBadge) ratioBadge.textContent = studyPercent + '% Study Focus';

                    if (studyPercent >= 60) {
                        if (ratioAdvice) ratioAdvice.textContent = 'Awesome balance! Deep work dominates your digital usage.';
                        if (ratioBar) ratioBar.className = 'progress-bar bg-success';
                    } else {
                        if (ratioAdvice) ratioAdvice.textContent = 'Caution: Social media minutes exceed study hours. Try 25-min Pomodoro blocks.';
                        if (ratioBar) ratioBar.className = 'progress-bar bg-warning text-dark';
                    }
                }

                logsContainer.innerHTML = logs.map(function(item) {
                    return (
                        '<div class="card bg-dark border-secondary p-3 mb-2 d-flex flex-row justify-content-between align-items-center text-white">' +
                            '<div>' +
                                '<div class="fw-semibold">' + item.primary_distraction + '</div>' +
                                '<small class="text-secondary">' +
                                    '<span class="text-info"><i class="fa-solid fa-book-open me-1"></i>' + item.study_minutes + 'm study</span> &bull; ' +
                                    '<span class="text-danger"><i class="fa-solid fa-mobile me-1"></i>' + item.social_media_minutes + 'm screen</span>' +
                                '</small>' +
                            '</div>' +
                            '<div class="text-end">' +
                                '<span class="badge bg-secondary">Urge: ' + item.distraction_rating + '/10</span>' +
                                '<div class="small text-secondary mt-1">' + item.log_date + '</div>' +
                            '</div>' +
                        '</div>'
                    );
                }).join('');
            }

            // Submit handler
            var form = document.getElementById('screenLogForm');
            if (form) {
                form.onsubmit = async function(e) {
                    e.preventDefault();
                    var social = parseInt(document.getElementById('socialMins').value, 10) || 0;
                    var study = parseInt(document.getElementById('studyMins').value, 10) || 0;
                    var app = document.getElementById('distractionApp').value;
                    var rating = parseInt(rangeUrge.value, 10);

                    try {
                        var { error } = await window.sb.from('screen_time_logs').insert([{
                            user_id: user.id,
                            social_media_minutes: social,
                            study_minutes: study,
                            primary_distraction: app,
                            distraction_rating: rating
                        }]);

                        if (error) throw error;
                        showAlert('Screen-time logged successfully!', 'success');
                        form.reset();
                        urgeVal.textContent = '5';
                        loadLogs();
                    } catch (err) {
                        console.error(err);
                        showAlert('Failed to save screen log', 'danger');
                    }
                };
            }

            loadLogs();
        });
    </script>
</body>
</html>
